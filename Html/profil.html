<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chargement... - HuskyMichel</title>

<link rel="icon" href="logo.jpg">

<link rel="stylesheet" href="profil.css">

</head>


<body>


<!-- =======================================================
     BARRE DU HAUT
======================================================= -->

<header>


    <div class="logo">

        <img
            src="Photo de profil/titre.jpg"
            id="logoAccueil"
            alt="Accueil"
        >

    </div>


    <div class="search">

        <input
            id="rechercheProfil"
            type="text"
            placeholder="🔍 Rechercher un profil..."
        >

        <div id="resultatsRecherche"></div>

    </div>


    <div class="account">


        <button id="loginBtn">

            Se connecter

        </button>


        <div
            id="profile"
            class="profile"
        >

            <img
                id="avatar"
                alt="Compte"
            >


            <div
                id="menu"
                class="menu"
            >

                <a href="index.html">

                    🏠 Accueil

                </a>


                <a href="creation-profil.html">

                    ✏️ Modifier mon profil

                </a>


                <button id="logout">

                    🚪 Déconnexion

                </button>

            </div>

        </div>

    </div>

</header>


<!-- =======================================================
     BANNIERE
======================================================= -->

<div class="banner"></div>


<!-- =======================================================
     PROFIL
======================================================= -->

<main>


    <!-- =====================================================
         PHOTO
    ====================================================== -->

    <div class="profilHeader">

        <img
            id="photo"
            class="photo"
            alt="Photo de profil"
        >

    </div>


    <div class="infos">


        <!-- =================================================
             PSEUDO + FAVORI
        ================================================== -->

        <div class="pseudoFavori">

            <div id="pseudo">

                Chargement...

            </div>


            <!--
                Étoile des favoris

                ☆ = pas en favori
                ★ = favori

                Le profil.js s'occupe de changer
                automatiquement le symbole.
            -->

            <button
                id="boutonFavoriProfil"
                type="button"
                aria-label="Ajouter ce profil aux favoris"
                title="Ajouter aux favoris"
            >

                ☆

            </button>

        </div>


        <!-- =================================================
             DESCRIPTION COURTE
        ================================================== -->

        <div id="descriptionCourte">

            Chargement...

        </div>


        <!-- =================================================
             LIKES
        ================================================== -->

        <div class="profilLikeZone">


            <button
                id="boutonLikeProfil"
                class="boutonLikeProfil"
                type="button"
            >

                ♡ J'aime

            </button>


            <div
                id="compteurLikesProfil"
                class="compteurLikesProfil"
            >

                ❤️ 0 likes

            </div>


            <div
                id="listeLikers"
                class="listeLikers"
            ></div>


        </div>


        <!-- =================================================
             A PROPOS
        ================================================== -->

        <div class="section">

            <h2>

                📖 À propos

            </h2>


            <p id="descriptionLongue">

                Chargement...

            </p>

        </div>


        <!-- =================================================
             VIDEO
        ================================================== -->

        <div
            id="sectionVideo"
            class="section"
        >

            <h2>

                🎬 Vidéo mise en avant

            </h2>


            <div id="videoContainer"></div>

        </div>


        <!-- =================================================
             CATEGORIES
        ================================================== -->

        <div class="section">

            <h2>

                🏷️ Catégories

            </h2>


            <div id="categories"></div>

        </div>


        <!-- =================================================
             RESEAUX
        ================================================== -->

        <div class="section">

            <h2>

                🌐 Réseaux

            </h2>


            <div id="reseaux"></div>

        </div>


        <!-- =================================================
             RETOUR
        ================================================== -->

        <button id="retourAccueil">

            ← Retour à l'accueil

        </button>


        <!-- =================================================
             MES FAVORIS

             IMPORTANT :
             Cette section est volontairement placée
             TOUT EN BAS du profil.
        ================================================== -->

        <section
            id="sectionFavoris"
            class="sectionFavoris"
        >


            <div class="titreFavoris">

                ⭐ Mes favoris

            </div>


            <div
                id="listeFavoris"
                class="listeFavoris"
            >

                <!--
                    Les favoris seront ajoutés
                    automatiquement par profil.js.
                -->

            </div>


        </section>


    </div>

</main>


<!-- =======================================================
     JAVASCRIPT
======================================================= -->

<script
    type="module"
    src="profil.js">
</script>


</body>

</html>
