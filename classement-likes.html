<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Classement des likes - HuskyMichel</title>

    <link rel="icon" href="logo.jpg">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="classement-likes.css">
</head>

<body>

    <header>
        <div class="logo">
            <a href="https://huskymichel.github.io/HuskyMichel/">
                <img src="Photo de profil/Accueil.jpg" alt="Accueil">
            </a>
        </div>

        <a class="retourAccueil" href="index.html">
            ← Accueil
        </a>
    </header>

    <main>

        <section class="titreClassement">
            <div class="iconeClassement">❤️</div>

            <h1>Classement des likes</h1>

            <p>
                Découvre les profils qui ont reçu le plus de likes !
            </p>
        </section>

        <section class="classement">

            <div class="classementEntete">
                <h2>🏆 Les profils les plus aimés</h2>
                <span id="nombreProfils">Chargement...</span>
            </div>

            <div id="listeClassement">

                <p class="messageClassement">
                    Chargement du classement...
                </p>

            </div>

        </section>

    </main>

    <script type="module" src="classement-likes.js"></script>
