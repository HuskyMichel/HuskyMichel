

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gaming - HuskyMichel</title>

    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="gaming.css">

    <link rel="icon" href="Photo de profil/Accueil.jpg">
</head>

<body>

    <header class="gaming-header">

        <div class="logo">
            <a href="index.html">
                <img src="Photo de profil/Accueil.jpg" alt="Accueil">
            </a>
        </div>

        <div class="search">
            <input
                id="rechercheJeu"
                type="search"
                placeholder="Rechercher un jeu..."
                autocomplete="off"
            >
        </div>

        <div class="account">

            <button id="loginBtn" type="button">
                Se connecter
            </button>

            <div class="profile" id="profile">

                <img
                    id="avatar"
                    src=""
                    alt="Mon compte"
                    title="Mon compte"
                >

                <div class="menu" id="menu">

                    <a href="#" id="monProfil">
                        👤 Mon profil
                    </a>

                    <button id="changePhoto" type="button">
                        🖼️ Changer la photo
                    </button>

                    <button id="logout" type="button">
                        🚪 Déconnexion
                    </button>

                </div>

            </div>

        </div>

    </header>

    <main class="gaming-container">

        <div class="gaming-introduction">
            <h1>Gaming</h1>
            <p>
                Retrouve les profils selon leurs jeux vidéo préférés !
            </p>
        </div>

        <section id="listeJeux" class="liste-jeux">

            <div class="gaming-chargement">
                Chargement des jeux...
            </div>

        </section>

        <p id="aucunJeuTrouve" class="gaming-message-vide" hidden>
            Aucun jeu trouvé.
        </p>

    </main>

    <script type="module" src="gaming.js"></script>

</body>
</html>
