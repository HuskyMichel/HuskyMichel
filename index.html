<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HuskyMichel</title>

<link rel="icon" href="Photo de profil/titre.jpg">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#1f1f1f;
    color:white;
}


/* ========================= */
/* HEADER */
/* ========================= */

header{

    position:sticky;
    top:0;

    height:60px;

    background:#0f0f0f;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    border-bottom:1px solid #2b2b2b;

    z-index:1000;

}


/* ========================= */
/* LOGO */
/* ========================= */

.logo{

    display:flex;
    align-items:center;

}

.logo img{

    height:42px;

    cursor:pointer;

}


/* ========================= */
/* RECHERCHE */
/* ========================= */

.search{

    flex:1;

    display:flex;

    justify-content:center;

}

.search input{

    width:520px;

    max-width:90%;

    background:#151515;

    color:white;

    border:1px solid #333;

    border-radius:30px;

    padding:11px 18px;

    font-size:15px;

    outline:none;

}

.search input:focus{

    border-color:#3ea6ff;

}


/* ========================= */
/* COMPTE */
/* ========================= */

.account{

    display:flex;

    align-items:center;

    gap:12px;

}


/* ========================= */
/* BOUTON CONNEXION */
/* ========================= */

#loginBtn{

    background:#3ea6ff;

    color:white;

    border:none;

    border-radius:25px;

    padding:10px 18px;

    font-size:15px;

    cursor:pointer;

    transition:0.2s;

}

#loginBtn:hover{

    background:#61b8ff;

}


/* ========================= */
/* PHOTO DE COMPTE */
/* ========================= */

.profile{

    display:none;

    position:relative;

}

#avatar{

    width:42px;

    height:42px;

    border-radius:50%;

    object-fit:cover;

    cursor:pointer;

    border:2px solid #3ea6ff;

}


/* ========================= */
/* MENU COMPTE */
/* ========================= */

.menu{

    display:none;

    position:absolute;

    top:55px;

    right:0;

    width:230px;

    background:#242424;

    border-radius:12px;

    overflow:hidden;

    box-shadow:0 0 20px rgba(0,0,0,.5);

}

.menu a,
.menu button{

    width:100%;

    display:block;

    padding:14px;

    background:none;

    border:none;

    color:white;

    text-align:left;

    font-size:15px;

    cursor:pointer;

}

.menu a{

    text-decoration:none;

}

.menu a:hover,
.menu button:hover{

    background:#333;

}


/* ========================= */
/* CONTENU PRINCIPAL */
/* ========================= */

main{

    padding:25px;

}


/* ========================= */
/* LISTE DES PROFILS */
/* ========================= */

#listeProfils{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(280px,1fr)
        );

    gap:25px;

    margin-top:30px;

}


/* ========================= */
/* CARTE PROFIL */
/* ========================= */

.carteProfil{

    background:#2a2a2a;

    border-radius:18px;

    overflow:hidden;

    transition:.25s;

    cursor:pointer;

}

.carteProfil:hover{

    transform:translateY(-6px);

}


/* ========================= */
/* PHOTO DU PROFIL */
/* ========================= */

.cartePhoto{

    width:110px;

    height:110px;

    object-fit:cover;

    border-radius:50%;

    display:block;

    margin:25px auto 15px;

    border:4px solid white;

    box-shadow:
        0 0 8px white,
        0 0 18px rgba(255,255,255,0.8);

}


/* ========================= */
/* CONTENU DE LA CARTE */
/* ========================= */

.carteContenu{

    padding:18px;

}


/* ========================= */
/* PSEUDO */
/* ========================= */

.cartePseudo{

    font-size:22px;

    font-weight:bold;

}


/* ========================= */
/* DESCRIPTION */
/* ========================= */

.carteDescription{

    color:#bdbdbd;

    margin:12px 0;

}


/* ========================= */
/* CATEGORIES */
/* ========================= */

.carteCategories{

    display:flex;

    flex-wrap:wrap;

    align-items:center;

    gap:7px;

    margin-top:12px;

}


/* ========================= */
/* PASTILLE CATEGORIE */
/* ========================= */

.categorieCarte{

    display:inline-block;

    background:#3ea6ff;

    color:white;

    padding:6px 10px;

    border-radius:20px;

    font-size:13px;

    font-weight:bold;

    box-shadow:
        0 0 6px rgba(62,166,255,0.35);

}


/* ========================= */
/* BOUTON +3 / +4 */
/* ========================= */

.categoriePlus{

    background:#444;

    color:#ddd;

    cursor:pointer;

    transition:0.2s;

}

.categoriePlus:hover{

    background:#555;

    transform:scale(1.05);

}


/* ========================= */
/* CATEGORIES CACHEES */
/* ========================= */

.categoriesCachees{

    display:none;

    flex-wrap:wrap;

    gap:7px;

    width:100%;

    margin-top:2px;

}


/* ========================= */
/* LIKES */
/* ========================= */

.carteLikes{

    color:#3ea6ff;

    font-weight:bold;

    margin-top:15px;

}


/* ========================= */
/* RESPONSIVE */
/* ========================= */

@media(max-width:700px){

    header{

        padding:0 10px;

    }

    .search input{

        width:300px;

    }

    main{

        padding:15px;

    }

    #listeProfils{

        grid-template-columns:
            repeat(
                auto-fill,
                minmax(240px,1fr)
            );

        gap:15px;

    }

}

/* ========================= */
/* RESEAUX DE LA CARTE */
/* ========================= */

.carteReseaux{

    display:flex;

    flex-wrap:wrap;

    gap:8px;

    margin-top:15px;

}

.reseauCarte{

    display:inline-block;

    padding:7px 11px;

    background:#181818;

    color:#3ea6ff;

    border:1px solid #3ea6ff;

    border-radius:20px;

    font-size:13px;

    font-weight:bold;

    text-decoration:none;

    transition:.2s;

}

.reseauCarte:hover{

    background:#3ea6ff;

    color:white;

    transform:translateY(-2px);

}


/* ========================= */
/* BOUTON VOIR PROFIL */
/* ========================= */

.boutonVoirProfil{

    width:100%;

    margin-top:18px;

    padding:11px;

    background:#3ea6ff;

    color:white;

    border:none;

    border-radius:10px;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}

.boutonVoirProfil:hover{

    background:#61b8ff;

    transform:translateY(-2px);

}

/* =========================================================
   RESULTATS DE RECHERCHE
========================================================= */

.search{

    position:relative;

}


#resultatsRecherche{

    position:absolute;

    top:55px;

    left:50%;

    transform:translateX(-50%);

    width:520px;

    max-width:90%;

    background:#242424;

    border-radius:12px;

    overflow:hidden;

    box-shadow:0 8px 25px rgba(0,0,0,.5);

    z-index:2000;

    display:none;

}


/* =========================
   RESULTAT
========================= */

.resultatRecherche{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

    padding:10px 15px;

    cursor:pointer;

    transition:.15s;

}


.resultatRecherche:hover{

    background:#333;

}


/* =========================
   PSEUDO
========================= */

.resultatRecherche img{

    width:42px;

    height:42px;

    border-radius:50%;

    object-fit:cover;

    border:2px solid white;

    box-shadow:
        0 0 6px white,
        0 0 12px rgba(255,255,255,.6);

    transition:transform 0.2s ease;
}


/* =========================
   PHOTO
========================= */

.resultatRecherche img{

    width:42px;

    height:42px;

    border-radius:50%;

    object-fit:cover;

    border:2px solid white;

    box-shadow:
        0 0 6px white,
        0 0 12px rgba(255,255,255,.6);

    transition:transform 0.2s ease;
}

/* =========================
   ZOOM AU SURVOL
========================= */

.resultatRecherche:hover .resultatRecherchePseudo{

    transform:scale(1.05);

}

.resultatRecherche:hover img{

    transform:scale(1.12);

}

/* =========================================================
   BOUTON LIKE
========================================================= */

.boutonLike{

    width:100%;

    margin-top:12px;

    padding:10px;

    background:#333;

    color:white;

    border:1px solid #444;

    border-radius:10px;

    cursor:pointer;

    font-size:15px;

    font-weight:bold;

    transition:
        transform .2s,
        background .2s,
        color .2s;

}

.boutonLike:hover{

    transform:scale(1.03);

    background:#444;

}

.boutonLike.likeActif{

    background:#3ea6ff;

    color:white;

}


/* =========================================================
   COEURS
========================================================= */

.carteProfil{

    position:relative;

}


.coeurLike{

    position:absolute;

    z-index:50;

    pointer-events:none;

    font-size:22px;

    animation:
        coeurExplosion 1.2s ease-out forwards;

}


@keyframes coeurExplosion{

    0%{

        opacity:1;

        transform:
            translate(
                0,
                0
            )
            scale(.5)
            rotate(0deg);

    }

    50%{

        opacity:1;

        transform:
            translate(
                calc((var(--rotation)) * 2),
                -45px
            )
            scale(1.2)
            rotate(
                var(--rotation)
            );

    }

    100%{

        opacity:0;

        transform:
            translate(
                calc((var(--rotation)) * 4),
                -120px
            )
            scale(.7)
            rotate(
                var(--rotation)
            );

    }

}

/* =========================================================
   EFFET COUP DE COEUR SUR LA CARTE
========================================================= */

.carteProfil{
    position:relative;
    overflow:hidden;
    transition:
        background .35s ease,
        box-shadow .35s ease,
        transform .2s ease;
}


/* Carte lorsqu'elle reçoit un like */

.carteProfil.animationLike{

    background:linear-gradient(
        135deg,
        #ff1744,
        #ff4f81,
        #ff1744
    );

    box-shadow:
        0 0 20px rgba(255,23,68,.7),
        0 0 45px rgba(255,79,129,.5);

}


/* =========================================================
   COEURS DE L'ANIMATION
========================================================= */

.coeurAnimation{

    position:absolute;

    pointer-events:none;

    z-index:50;

    color:#ff1744;

    font-size:35px;

    animation:
        coeurMontee 1s ease-out forwards;

    filter:
        drop-shadow(
            0 0 8px rgba(255,255,255,.8)
        );

}


@keyframes coeurMontee{

    0%{

        transform:
            translateY(30px)
            scale(.4)
            rotate(0deg);

        opacity:0;

    }

    15%{

        opacity:1;

    }

    50%{

        transform:
            translateY(-70px)
            scale(1.3)
            rotate(-12deg);

        opacity:1;

    }

    100%{

        transform:
            translateY(-180px)
            scale(.8)
            rotate(15deg);

        opacity:0;

    }

}


/* =========================================================
   BOUTON LIKE
========================================================= */

.boutonLike{

    border:none;

    background:#333;

    color:white;

    border-radius:25px;

    padding:9px 15px;

    cursor:pointer;

    font-size:14px;

    transition:
        background .25s ease,
        transform .2s ease,
        box-shadow .25s ease;

}


/* Bouton liké */

.boutonLike.liked{

    background:#ff1744;

    color:white;

    box-shadow:
        0 0 10px rgba(255,23,68,.6),
        0 0 20px rgba(255,23,68,.35);

}


/* Petit effet au survol */

.boutonLike:hover{

    transform:scale(1.08);

}


/* Effet lorsque le bouton vient d'être cliqué */

.boutonLike.likeClick{

    transform:scale(1.25);

}

.actionsCarte{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:12px;
    flex-wrap:wrap;
}

.boutonFavori{
    width:42px;
    height:42px;

    border:none;
    border-radius:10px;

    background:#2a2a2a;
    color:white;

    font-size:24px;

    cursor:pointer;

    transition:
        transform .2s ease,
        background .2s ease,
        box-shadow .2s ease;
}

.boutonFavori:hover{
    transform:scale(1.08);
    background:#333;
}

.boutonFavori.favoriActif{
    background:#3a2f00;
    box-shadow:
        0 0 12px rgba(255,215,0,.35);
}

.boutonFavori.favoriClick{
    animation:animationFavori .3s ease;
}

@keyframes animationFavori{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.4) rotate(8deg);
    }

    100%{
        transform:scale(1);
    }

}

</style>

</head>

<body>

<header>

<div class="logo">

<a href="https://huskymichel.github.io/HuskyMichel-site/">

<img src="Photo de profil/Accueil.jpg" alt="Accueil">

</a>

</div>

<div class="search">

    <input
        id="rechercheProfil"
        type="text"
        placeholder="🔍 Rechercher un profil..."
    >

    <div id="resultatsRecherche"></div>

</div>

<div class="account">

<button id="loginBtn">

Se connecter

</button>

<div class="profile" id="profile">

<img id="avatar">

<div class="menu" id="menu">

<a href="#">👤 Mon profil</a>

<button id="changePhoto">

🖼️ Changer la photo

</button>

<button id="logout">

🚪 Déconnexion

</button>

</div>

</div>

</div>

</header>

<main>

<h1>Bienvenue !</h1>


<h2>Créateurs</h2>

<div id="listeProfils"></div>


</main>

<script type="module" src="index.js"></script>

</body>
</html>
