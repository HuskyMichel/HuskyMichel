<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Personnes qui aiment ce profil - HuskyMichel</title>

<link
    rel="icon"
    href="logo.jpg"
>

<link
    rel="stylesheet"
    href="profil.css"
>

<link
    rel="stylesheet"
    href="youtube-theme.css"
>

<link
    rel="stylesheet"
    href="likers.css"
>

</head>


<body>


<!-- =======================================================
     BARRE DU HAUT
======================================================= -->

<header>

    <div class="logo">

        <img
            src="Photo de profil/titre.jpg"
            id="logoAccueil"
            alt="Accueil"
        >

    </div>


    <div class="account">

        <button id="loginBtn">
            Se connecter
        </button>


        <div
            id="profile"
            class="profile"
        >

            <img
                id="avatar"
                alt="Compte"
            >


            <div
                id="menu"
                class="menu"
            >

                <a href="index.html">
                    🏠 Accueil
                </a>

                <a href="creation-profil.html">
                    ✏️ Modifier mon profil
                </a>

                <button id="logout">
                    🚪 Déconnexion
                </button>

            </div>

        </div>

    </div>

</header>



<!-- =======================================================
     CONTENU
======================================================= -->

<main class="pageLikers">


    <button
        id="retourProfil"
        class="retourProfil"
        type="button"
    >
        ← Retour au profil
    </button>


    <div class="titreLikers">

        <div class="titreLikersIcon">
            ❤️
        </div>


        <div>

            <h1 id="titreProfil">
                Personnes qui aiment ce profil
            </h1>

            <p id="nombreLikers">
                Chargement...
            </p>

        </div>

    </div>


    <div
        id="listeLikers"
        class="listeLikers"
    ></div>


    <div
        id="aucunLiker"
        class="aucunLiker"
        style="display:none;"
    >

        ❤️

        <h2>
            Aucun like pour le moment
        </h2>

        <p>
            Ce profil n'a pas encore reçu de like.
        </p>

    </div>


</main>



<script
    type="module"
    src="likers.js"
></script>


</body>

</html>
