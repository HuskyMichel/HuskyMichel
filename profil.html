<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* =========================================================
   BODY
========================================================= */

body{

    font-family:Arial,sans-serif;

    background:#1f1f1f;

    color:white;

    min-height:100vh;

}


/* =========================================================
   BARRE DU HAUT
========================================================= */

header{

    position:sticky;

    top:0;

    z-index:1000;

    height:60px;

    background:#0f0f0f;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 20px;

    border-bottom:1px solid #2b2b2b;

}


/* =========================================================
   LOGO
========================================================= */

.logo{

    display:flex;

    align-items:center;

}

.logo img{

    height:42px;

    width:auto;

    cursor:pointer;

    border-radius:8px;

    transition:.2s;

}

.logo img:hover{

    transform:scale(1.05);

}


/* =========================================================
   RECHERCHE
========================================================= */

.search{

    flex:1;

    display:flex;

    justify-content:center;

    margin:0 25px;

    position:relative;

}

.search input{

    width:520px;

    max-width:100%;

    padding:11px 20px;

    border-radius:30px;

    border:1px solid #333;

    background:#151515;

    color:white;

    outline:none;

    font-size:15px;

    transition:.2s;

}

.search input:focus{

    border-color:#3ea6ff;

    box-shadow:0 0 10px rgba(62,166,255,.2);

}

.search input::placeholder{

    color:#888;

}


/* =========================================================
   RESULTATS DE RECHERCHE
========================================================= */

#resultatsRecherche{

    position:absolute;

    top:55px;

    left:50%;

    transform:translateX(-50%);

    width:520px;

    max-width:90%;

    background:#242424;

    border-radius:12px;

    overflow:hidden;

    box-shadow:0 8px 25px rgba(0,0,0,.5);

    z-index:2000;

    display:none;

}


/* =========================================================
   RESULTAT
========================================================= */

.resultatRecherche{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

    padding:10px 15px;

    cursor:pointer;

    transition:.15s;

}


.resultatRecherche:hover{

    background:#333;

}


/* =========================================================
   PSEUDO RESULTAT
========================================================= */

.resultatRecherchePseudo{

    font-size:16px;

    font-weight:bold;

    color:white;

    transition:transform .2s ease;

}


/* =========================================================
   PHOTO RESULTAT
========================================================= */

.resultatRecherche img{

    width:42px;

    height:42px;

    border-radius:50%;

    object-fit:cover;

    border:2px solid white;

    box-shadow:

        0 0 6px white,

        0 0 12px rgba(255,255,255,.6);

    transition:transform .2s ease;

}


.resultatRecherche:hover
.resultatRecherchePseudo{

    transform:scale(1.05);

}


.resultatRecherche:hover img{

    transform:scale(1.12);

}


/* =========================================================
   COMPTE
========================================================= */

.account{

    display:flex;

    align-items:center;

    gap:12px;

}


/* =========================================================
   BOUTON CONNEXION
========================================================= */

#loginBtn{

    background:#3ea6ff;

    color:white;

    border:none;

    border-radius:25px;

    padding:10px 18px;

    font-size:15px;

    cursor:pointer;

    transition:.2s;

}

#loginBtn:hover{

    background:#61b8ff;

    transform:translateY(-1px);

}


/* =========================================================
   PROFIL COMPTE
========================================================= */

.profile{

    display:none;

    position:relative;

}


/* =========================================================
   AVATAR COMPTE
========================================================= */

#avatar{

    width:42px;

    height:42px;

    border-radius:50%;

    object-fit:cover;

    cursor:pointer;

    border:2px solid white;

    box-shadow:

        0 0 7px white,

        0 0 15px rgba(255,255,255,.7),

        0 0 25px rgba(255,255,255,.25);

    transition:.2s;

}

#avatar:hover{

    transform:scale(1.06);

}


/* =========================================================
   MENU COMPTE
========================================================= */

.menu{

    display:none;

    position:absolute;

    top:55px;

    right:0;

    width:230px;

    background:#242424;

    border:1px solid #383838;

    border-radius:14px;

    overflow:hidden;

    box-shadow:

        0 10px 35px rgba(0,0,0,.6);

}

.menu a,
.menu button{

    width:100%;

    display:block;

    padding:14px;

    border:none;

    background:none;

    color:white;

    text-align:left;

    text-decoration:none;

    font-size:15px;

    cursor:pointer;

    transition:.15s;

}

.menu a:hover,
.menu button:hover{

    background:#333;

}


/* =========================================================
   BANNIERE
========================================================= */

.banner{

    height:300px;

    background:

        linear-gradient(

            135deg,

            #353535,

            #202020

        );

    position:relative;

    overflow:hidden;

}


.banner::before{

    content:"";

    position:absolute;

    width:500px;

    height:500px;

    border-radius:50%;

    background:rgba(62,166,255,.08);

    top:-250px;

    left:50%;

    transform:translateX(-50%);

    filter:blur(50px);

}


/* =========================================================
   CONTENEUR PRINCIPAL
========================================================= */

main{

    max-width:1150px;

    margin:auto;

    padding-bottom:70px;

}


/* =========================================================
   EN-TETE DU PROFIL
========================================================= */

.profilHeader{

    position:relative;

    padding:0 45px;

}


/* =========================================================
   PHOTO DE PROFIL
========================================================= */

.photo{

    width:185px;

    height:185px;

    object-fit:cover;

    display:block;

    margin-top:-92px;

    border-radius:50%;

    border:6px solid #1f1f1f;

    background:#222;

    box-shadow:

        0 0 8px white,

        0 0 18px white,

        0 0 35px rgba(255,255,255,.8),

        0 0 60px rgba(255,255,255,.25);

    position:relative;

    z-index:2;

}


/* =========================================================
   INFOS
========================================================= */

.infos{

    padding:25px 45px;

}


/* =========================================================
   CONTENEUR PSEUDO + FAVORI
========================================================= */

.pseudoFavori{

    display:flex;

    align-items:center;

    gap:18px;

    margin-top:5px;

}


/* =========================================================
   PSEUDO
========================================================= */

#pseudo{

    font-size:40px;

    font-weight:bold;

    line-height:1.2;

}


/* =========================================================
   BOUTON FAVORI
========================================================= */

#boutonFavoriProfil{

    display:none;

    border:none;

    background:transparent;

    color:white;

    font-size:48px;

    line-height:1;

    padding:0;

    margin:0;

    cursor:pointer;

    transition:

        transform .2s ease,

        color .2s ease,

        text-shadow .2s ease;

}


#boutonFavoriProfil:hover{

    transform:scale(1.15);

    color:#ffd700;

    text-shadow:

        0 0 8px rgba(255,215,0,.7),

        0 0 18px rgba(255,215,0,.4);

}


#boutonFavoriProfil.favoriActif{

    color:#ffd700;

    text-shadow:

        0 0 8px rgba(255,215,0,.7),

        0 0 20px rgba(255,215,0,.5);

}


#boutonFavoriProfil.favoriActif:hover{

    transform:scale(1.15);

}


/* =========================================================
   DESCRIPTION COURTE
========================================================= */

#descriptionCourte{

    color:#bdbdbd;

    font-size:17px;

    margin-top:10px;

    line-height:1.5;

}


/* =========================================================
   LIKE
========================================================= */

.profilLikeZone{

    margin-top:20px;

    display:flex;

    flex-direction:column;

    align-items:flex-start;

    gap:10px;

}


/* =========================================================
   BOUTON LIKE
========================================================= */

.boutonLikeProfil{

    padding:12px 24px;

    border:none;

    border-radius:30px;

    background:#333;

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:

        transform .2s ease,

        background .25s ease,

        box-shadow .25s ease;

}


.boutonLikeProfil:hover{

    transform:scale(1.08);

    background:#444;

}


.boutonLikeProfil.liked{

    background:#ff1744;

    color:white;

    box-shadow:

        0 0 12px rgba(255,23,68,.7),

        0 0 30px rgba(255,23,68,.35);

}


.boutonLikeProfil.likeClick{

    transform:scale(1.3);

}


/* =========================================================
   COMPTEUR LIKES
========================================================= */

.compteurLikesProfil{

    color:#ff1744;

    font-size:17px;

    font-weight:bold;

}


/* =========================================================
   PERSONNES QUI ONT LIKÉ
========================================================= */

.listeLikers{

    display:flex;

    flex-wrap:wrap;

    align-items:center;

    gap:8px;

    margin-top:4px;

}


.liker{

    display:flex;

    align-items:center;

    gap:6px;

    background:#292929;

    border:1px solid #444;

    border-radius:25px;

    padding:5px 10px 5px 5px;

    transition:

        transform .2s ease,

        background .2s ease;

}


.liker:hover{

    transform:scale(1.06);

    background:#333;

}


.liker img{

    width:30px;

    height:30px;

    border-radius:50%;

    object-fit:cover;

    border:2px solid #ff1744;

}


.liker span{

    color:white;

    font-size:13px;

    font-weight:bold;

}


/* =========================================================
   SECTIONS
========================================================= */

.section{

    margin-top:30px;

    padding:25px;

    background:#292929;

    border:1px solid #363636;

    border-radius:18px;

    box-shadow:

        0 8px 25px rgba(0,0,0,.15);

    transition:.2s;

}


.section:hover{

    border-color:#444;

    transform:translateY(-2px);

}


.section h2{

    margin:0 0 20px 0;

    font-size:22px;

}


/* =========================================================
   DESCRIPTION LONGUE
========================================================= */

#descriptionLongue{

    color:#ddd;

    line-height:1.7;

    font-size:16px;

    white-space:pre-wrap;

}


/* =========================================================
   VIDEO
========================================================= */

#videoContainer{

    width:100%;

    overflow:hidden;

    border-radius:15px;

    background:#111;

    box-shadow:

        0 8px 25px rgba(0,0,0,.35);

}


#videoContainer iframe{

    display:block;

    width:100%;

    height:500px;

    border:none;

}


/* =========================================================
   CATEGORIES
========================================================= */

#categories{

    display:flex;

    flex-wrap:wrap;

    gap:9px;

}


/* =========================================================
   TAG
========================================================= */

.tag{

    display:inline-flex;

    align-items:center;

    padding:9px 15px;

    background:#3ea6ff;

    color:white;

    border-radius:25px;

    font-size:14px;

    font-weight:bold;

    box-shadow:

        0 0 8px rgba(62,166,255,.25);

    transition:.2s;

}


.tag:hover{

    transform:translateY(-2px);

    box-shadow:

        0 0 14px rgba(62,166,255,.45);

}


/* =========================================================
   RESEAUX
========================================================= */

#reseaux{

    display:flex;

    flex-direction:column;

    gap:12px;

}


.reseau{

    padding:15px 17px;

    background:#202020;

    border:1px solid #353535;

    border-radius:12px;

    transition:.2s;

}


.reseau:hover{

    background:#252525;

    border-color:#444;

    transform:translateX(3px);

}


.reseau strong{

    color:white;

    margin-right:5px;

}


.reseau a{

    color:#3ea6ff;

    text-decoration:none;

    word-break:break-all;

}


.reseau a:hover{

    text-decoration:underline;

}


/* =========================================================
   FAVORIS
   TOUJOURS EN BAS DU PROFIL
========================================================= */

#sectionFavoris{

    display:none;

    margin-top:40px;

    padding:25px;

    background:#292929;

    border:1px solid #363636;

    border-radius:18px;

    box-shadow:

        0 8px 25px rgba(0,0,0,.2);

}


.titreFavoris{

    font-size:22px;

    font-weight:bold;

    margin-bottom:20px;

}


.listeFavoris{

    display:grid;

    grid-template-columns:

        repeat(

            auto-fill,

            minmax(220px,1fr)

        );

    gap:15px;

}


/* =========================================================
   CARTE FAVORI
========================================================= */

.carteFavori{

    display:flex;

    align-items:center;

    gap:12px;

    padding:12px;

    background:#202020;

    border:1px solid #383838;

    border-radius:14px;

    cursor:pointer;

    transition:

        transform .2s ease,

        background .2s ease,

        border-color .2s ease,

        box-shadow .2s ease;

}


.carteFavori:hover{

    transform:translateY(-3px);

    background:#252525;

    border-color:#ffd700;

    box-shadow:

        0 5px 18px rgba(0,0,0,.35);

}


.carteFavori img{

    width:55px;

    height:55px;

    border-radius:50%;

    object-fit:cover;

    border:2px solid white;

}


.carteFavoriInfos{

    display:flex;

    flex-direction:column;

    gap:4px;

    min-width:0;

}


.carteFavoriPseudo{

    color:white;

    font-size:16px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


.carteFavoriDescription{

    color:#999;

    font-size:13px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


/* =========================================================
   FAVORIS VIDES
========================================================= */

.aucunFavori{

    color:#888;

    font-size:15px;

}


/* =========================================================
   BOUTON RETOUR
========================================================= */

#retourAccueil{

    margin-top:30px;

    padding:12px 22px;

    background:#3ea6ff;

    border:none;

    border-radius:12px;

    color:white;

    cursor:pointer;

    font-size:15px;

    font-weight:bold;

    transition:.2s;

}


#retourAccueil:hover{

    background:#61b8ff;

    transform:translateY(-2px);

    box-shadow:

        0 5px 15px rgba(62,166,255,.25);

}


/* =========================================================
   CHARGEMENT
========================================================= */

#pseudo:empty::after{

    content:"Chargement...";

    color:#888;

}


/* =========================================================
   COEURS PROFIL
========================================================= */

.coeurProfilAnimation{

    position:fixed;

    z-index:9999;

    pointer-events:none;

    color:#ff1744;

    font-size:45px;

    filter:

        drop-shadow(

            0 0 8px rgba(255,255,255,.8)

        );

    animation:

        coeurProfilMontee

        1.5s

        ease-out

        forwards;

}


@keyframes coeurProfilMontee{

    0%{

        opacity:0;

        transform:

            translate(

                0,

                50px

            )

            scale(.3)

            rotate(0deg);

    }

    15%{

        opacity:1;

    }

    50%{

        opacity:1;

        transform:

            translate(

                var(--deplacement),

                -100px

            )

            scale(1.4)

            rotate(var(--rotation));

    }

    100%{

        opacity:0;

        transform:

            translate(

                calc(var(--deplacement) * 1.5),

                -350px

            )

            scale(.8)

            rotate(var(--rotation));

    }

}


/* =========================================================
   EFFET AMOUR
========================================================= */

body.animationAmour{

    animation:

        amourPage

        1.1s

        ease;

}


@keyframes amourPage{

    0%{

        filter:none;

    }

    25%{

        filter:

            sepia(.15)

            saturate(1.7)

            hue-rotate(315deg);

    }

    55%{

        filter:

            sepia(.2)

            saturate(1.9)

            hue-rotate(320deg);

    }

    100%{

        filter:none;

    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    header{

        height:auto;

        min-height:60px;

        padding:8px 10px;

        gap:8px;

    }


    .logo img{

        height:38px;

    }


    .search{

        margin:0 5px;

    }


    .search input{

        width:100%;

        padding:10px 14px;

        font-size:14px;

    }


    #loginBtn{

        padding:9px 12px;

        font-size:13px;

    }


    #avatar{

        width:38px;

        height:38px;

    }


    .banner{

        height:190px;

    }


    main{

        width:100%;

    }


    .profilHeader{

        padding:0 20px;

    }


    .photo{

        width:135px;

        height:135px;

        margin-top:-67px;

        border-width:5px;

    }


    .infos{

        padding:20px;

    }


    .pseudoFavori{

        gap:12px;

    }


    #pseudo{

        font-size:30px;

    }


    #boutonFavoriProfil{

        font-size:40px;

    }


    #descriptionCourte{

        font-size:15px;

    }


    .section{

        padding:20px;

        border-radius:14px;

    }


    .section h2{

        font-size:20px;

    }


    #videoContainer iframe{

        height:280px;

    }


    .menu{

        right:-5px;

        width:210px;

    }


    .listeFavoris{

        grid-template-columns:

            1fr;

    }

}


/* =========================================================
   PETITS TELEPHONES
========================================================= */

@media(max-width:450px){

    .search input{

        width:150px;

    }


    #pseudo{

        font-size:27px;

    }


    #boutonFavoriProfil{

        font-size:36px;

    }


    .photo{

        width:120px;

        height:120px;

        margin-top:-60px;

    }


    #videoContainer iframe{

        height:220px;

    }

}

</style>

</head>


<body>


<!-- =======================================================
     BARRE DU HAUT
======================================================= -->

<header>


    <div class="logo">

        <img
            src="Photo de profil/titre.jpg"
            id="logoAccueil"
            alt="Accueil"
        >

    </div>


    <div class="search">

        <input
            id="rechercheProfil"
            type="text"
            placeholder="🔍 Rechercher un profil..."
        >

        <div id="resultatsRecherche"></div>

    </div>


    <div class="account">


        <button id="loginBtn">

            Se connecter

        </button>


        <div
            id="profile"
            class="profile"
        >

            <img
                id="avatar"
                alt="Compte"
            >


            <div
                id="menu"
                class="menu"
            >

                <a href="index.html">

                    🏠 Accueil

                </a>


                <a href="creation-profil.html">

                    ✏️ Modifier mon profil

                </a>


                <button id="logout">

                    🚪 Déconnexion

                </button>

            </div>

        </div>

    </div>

</header>


<!-- =======================================================
     BANNIERE
======================================================= -->

<div class="banner"></div>


<!-- =======================================================
     PROFIL
======================================================= -->

<main>


    <!-- =====================================================
         PHOTO
    ====================================================== -->

    <div class="profilHeader">

        <img
            id="photo"
            class="photo"
            alt="Photo de profil"
        >

    </div>


    <div class="infos">


        <!-- =================================================
             PSEUDO + FAVORI
        ================================================== -->

        <div class="pseudoFavori">

            <div id="pseudo">

                Chargement...

            </div>


            <!--
                Étoile des favoris

                ☆ = pas en favori
                ★ = favori

                Le profil.js s'occupe de changer
                automatiquement le symbole.
            -->

            <button
                id="boutonFavoriProfil"
                type="button"
                aria-label="Ajouter ce profil aux favoris"
                title="Ajouter aux favoris"
            >

                ☆

            </button>

        </div>


        <!-- =================================================
             DESCRIPTION COURTE
        ================================================== -->

        <div id="descriptionCourte">

            Chargement...

        </div>


        <!-- =================================================
             LIKES
        ================================================== -->

        <div class="profilLikeZone">


            <button
                id="boutonLikeProfil"
                class="boutonLikeProfil"
                type="button"
            >

                ♡ J'aime

            </button>


            <div
                id="compteurLikesProfil"
                class="compteurLikesProfil"
            >

                ❤️ 0 likes

            </div>


            <div
                id="listeLikers"
                class="listeLikers"
            ></div>


        </div>


        <!-- =================================================
             A PROPOS
        ================================================== -->

        <div class="section">

            <h2>

                📖 À propos

            </h2>


            <p id="descriptionLongue">

                Chargement...

            </p>

        </div>


        <!-- =================================================
             VIDEO
        ================================================== -->

        <div
            id="sectionVideo"
            class="section"
        >

            <h2>

                🎬 Vidéo mise en avant

            </h2>


            <div id="videoContainer"></div>

        </div>


        <!-- =================================================
             CATEGORIES
        ================================================== -->

        <div class="section">

            <h2>

                🏷️ Catégories

            </h2>


            <div id="categories"></div>

        </div>


        <!-- =================================================
             RESEAUX
        ================================================== -->

        <div class="section">

            <h2>

                🌐 Réseaux

            </h2>


            <div id="reseaux"></div>

        </div>


        <!-- =================================================
             RETOUR
        ================================================== -->

        <button id="retourAccueil">

            ← Retour à l'accueil

        </button>


        <!-- =================================================
             MES FAVORIS

             IMPORTANT :
             Cette section est volontairement placée
             TOUT EN BAS du profil.
        ================================================== -->

        <section
            id="sectionFavoris"
            class="sectionFavoris"
        >


            <div class="titreFavoris">

                ⭐ Mes favoris

            </div>


            <div
                id="listeFavoris"
                class="listeFavoris"
            >

                <!--
                    Les favoris seront ajoutés
                    automatiquement par profil.js.
                -->

            </div>


        </section>


    </div>

</main>


<!-- =======================================================
     JAVASCRIPT
======================================================= -->

<script
